[package]
name = "llama-cpp-test-model-provisioning"
description = "Downloads and loads the models llama-cpp-bindings integration tests run against"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
hf-hub = { workspace = true }
llama-cpp-backend = { workspace = true }
llama-cpp-bindings = { workspace = true }
llama-cpp-params = { workspace = true }
thiserror = { workspace = true }

[features]
cuda = ["llama-cpp-backend/cuda"]
cuda-no-vmm = ["llama-cpp-backend/cuda-no-vmm"]
metal = ["llama-cpp-backend/metal"]
vulkan = ["llama-cpp-backend/vulkan"]
rocm = ["llama-cpp-backend/rocm"]

[lints]
workspace = true
