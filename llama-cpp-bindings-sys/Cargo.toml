[package]
name = "llama-cpp-bindings-sys"
description = "Low level bindings to llama.cpp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

include = [
    "wrapper*.h",
    "wrapper_*.cpp",
    "build.rs",
    "/src",

    "/GSL/include/**/*",
    "/GSL/LICENSE",
]

[lib]
doctest = false

[dependencies]
llama-cpp-native = { workspace = true }

[build-dependencies]
llama-cpp-bindings-build = { workspace = true }

[features]
cuda = ["llama-cpp-native/cuda"]
cuda-no-vmm = ["cuda", "llama-cpp-native/cuda-no-vmm"]
metal = ["llama-cpp-native/metal"]
dynamic-link = ["llama-cpp-native/dynamic-link"]
dynamic-backends = ["dynamic-link", "llama-cpp-native/dynamic-backends"]
fault-injection = []
vulkan = ["llama-cpp-native/vulkan"]
openmp = ["llama-cpp-native/openmp"]
rocm = ["llama-cpp-native/rocm"]
shared-stdcxx = ["llama-cpp-native/shared-stdcxx"]
static-stdcxx = ["llama-cpp-native/static-stdcxx"]
system-ggml = ["llama-cpp-native/system-ggml"]
system-ggml-static = ["system-ggml", "llama-cpp-native/system-ggml-static"]

[lints]
workspace = true
