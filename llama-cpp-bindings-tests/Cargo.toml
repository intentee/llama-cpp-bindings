[package]
name = "llama-cpp-bindings-tests"
description = "Integration tests and fixtures for llama-cpp-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false

[lib]
doctest = false

[dependencies]
anyhow = { workspace = true }
encoding_rs = { workspace = true }
inventory = { workspace = true }
llama-cpp-backend = { workspace = true }
llama-cpp-bindings = { workspace = true }
llama-cpp-bindings-sys = { workspace = true }
llama-cpp-bindings-types = { workspace = true }
llama-cpp-context = { workspace = true }
llama-cpp-context-memory = { workspace = true }
llama-cpp-context-state = { workspace = true }
llama-cpp-fault-injection = { workspace = true }
llama-cpp-ffi-status = { workspace = true }
llama-cpp-gbnf = { workspace = true }
llama-cpp-gguf = { workspace = true }
llama-cpp-model = { workspace = true }
llama-cpp-mtmd = { workspace = true }
llama-cpp-params = { workspace = true }
llama-cpp-sampler = { workspace = true }
llama-cpp-test-harness = { workspace = true }
llama-cpp-test-harness-macros = { workspace = true }
llama-cpp-test-model-provisioning = { workspace = true }
llama-cpp-token-usage = { workspace = true }
serde_json = { workspace = true }
toktrie = { workspace = true }

[[test]]
name = "main"
harness = false

[features]
cuda = ["llama-cpp-backend/cuda"]
cuda-no-vmm = ["llama-cpp-backend/cuda-no-vmm"]
metal = ["llama-cpp-backend/metal"]
vulkan = ["llama-cpp-backend/vulkan"]
rocm = ["llama-cpp-backend/rocm"]

[lints]
workspace = true
