[workspace]
resolver = "2"
members = [
  "llama-cpp-backend",
  "llama-cpp-backend-tests",
  "llama-cpp-bindings-build",
  "llama-cpp-bindings-sys",
  "llama-cpp-bindings-types",
  "llama-cpp-bindings",
  "llama-cpp-bindings-tests",
  "llama-cpp-capturing-logger",
  "llama-cpp-chat",
  "llama-cpp-context",
  "llama-cpp-context-memory",
  "llama-cpp-context-state",
  "llama-cpp-error-chain",
  "llama-cpp-error-recorder",
  "llama-cpp-fault-injection",
  "llama-cpp-gbnf",
  "llama-cpp-gguf",
  "llama-cpp-log-decoder",
  "llama-cpp-model",
  "llama-cpp-mtmd",
  "llama-cpp-native",
  "llama-cpp-params",
  "llama-cpp-path-c-string",
  "llama-cpp-sampler",
  "llama-cpp-test-harness",
  "llama-cpp-test-harness-macros",
  "llama-cpp-test-model-provisioning",
  "llama-cpp-token-usage",
  "llama-cpp-wrapper-sources",
]

[workspace.package]
edition = "2024"
version = "0.30.0"
license = "Apache-2.0"
repository = "https://github.com/intentee/llama-cpp-bindings"

[workspace.dependencies]
anyhow = "1.0"
bindgen = "0.72"
cc = { version = "1.2", features = ["parallel"] }
cmake = "0.1"
encoding_rs = "0.8"
enumflags2 = "0.7"
find_cuda_helper = "0.2"
hf-hub = "0.5"
inventory = "0.3"
libc = "0.2"
libtest-mimic = "0.8"
llama-cpp-backend = { path = "llama-cpp-backend", version = "0.30", default-features = false }
llama-cpp-bindings = { path = "llama-cpp-bindings", version = "0.30" }
llama-cpp-bindings-build = { path = "llama-cpp-bindings-build", version = "0.30" }
llama-cpp-bindings-sys = { path = "llama-cpp-bindings-sys", version = "0.30" }
llama-cpp-bindings-types = { path = "llama-cpp-bindings-types", version = "0.30" }
llama-cpp-capturing-logger = { path = "llama-cpp-capturing-logger" }
llama-cpp-chat = { path = "llama-cpp-chat", version = "0.30" }
llama-cpp-context = { path = "llama-cpp-context", version = "0.30" }
llama-cpp-context-memory = { path = "llama-cpp-context-memory", version = "0.30" }
llama-cpp-context-state = { path = "llama-cpp-context-state", version = "0.30" }
llama-cpp-error-chain = { path = "llama-cpp-error-chain", version = "0.30" }
llama-cpp-error-recorder = { path = "llama-cpp-error-recorder", version = "0.30" }
llama-cpp-gbnf = { path = "llama-cpp-gbnf", version = "0.30" }
llama-cpp-gguf = { path = "llama-cpp-gguf", version = "0.30" }
llama-cpp-log-decoder = { path = "llama-cpp-log-decoder", version = "0.30" }
llama-cpp-model = { path = "llama-cpp-model", version = "0.30" }
llama-cpp-mtmd = { path = "llama-cpp-mtmd", version = "0.30" }
llama-cpp-native = { path = "llama-cpp-native", version = "0.30" }
llama-cpp-params = { path = "llama-cpp-params", version = "0.30" }
llama-cpp-path-c-string = { path = "llama-cpp-path-c-string", version = "0.30" }
llama-cpp-sampler = { path = "llama-cpp-sampler", version = "0.30" }
llama-cpp-test-harness = { path = "llama-cpp-test-harness", version = "0.30" }
llama-cpp-test-harness-macros = { path = "llama-cpp-test-harness-macros", version = "0.30" }
llama-cpp-test-model-provisioning = { path = "llama-cpp-test-model-provisioning", version = "0.30" }
llama-cpp-fault-injection = { path = "llama-cpp-fault-injection", version = "0.30" }
llama-cpp-token-usage = { path = "llama-cpp-token-usage", version = "0.30" }
llama-cpp-wrapper-sources = { path = "llama-cpp-wrapper-sources", version = "0.30" }
llguidance = "1.7"
log = "0.4"
once_cell = "1.21"
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serial_test = "3.4"
syn = { version = "2.0", features = ["full"] }
thiserror = "2.0"
toktrie = "1.7"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
arithmetic_side_effects = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[workspace.metadata.heisenberg]
test_crates = [
  "llama-cpp-backend-tests",
  "llama-cpp-bindings-tests",
  "llama-cpp-capturing-logger",
  "llama-cpp-test-harness",
  "llama-cpp-test-harness-macros",
  "llama-cpp-test-model-provisioning",
]

[[workspace.metadata.heisenberg.configurations]]
name = "x86_64-unknown-linux-gnu"
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []
