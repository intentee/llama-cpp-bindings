[package]
name = "llama-cpp-test-harness"
description = "Declarative, deterministic integration-test harness for llama-cpp-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
anyhow = { workspace = true }
inventory = { workspace = true }
libtest-mimic = { workspace = true }
llama-cpp-backend = { workspace = true, default-features = true }
llama-cpp-context = { workspace = true }
llama-cpp-model = { workspace = true }
llama-cpp-mtmd = { workspace = true }
llama-cpp-params = { workspace = true }
llama-cpp-test-harness-macros = { workspace = true }
llama-cpp-test-model-provisioning = { workspace = true }
thiserror = { workspace = true }

[features]
cuda = ["llama-cpp-backend/cuda"]
cuda-no-vmm = ["llama-cpp-backend/cuda-no-vmm"]
metal = ["llama-cpp-backend/metal"]
vulkan = ["llama-cpp-backend/vulkan"]
rocm = ["llama-cpp-backend/rocm"]

[[test]]
name = "duplicate_trial_names"
harness = false

[[test]]
name = "phase_conclusions"
harness = false

[lints]
workspace = true
