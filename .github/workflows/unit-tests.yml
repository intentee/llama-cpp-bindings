name: unit-tests

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  formatting:
    name: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - uses: ./.github/actions/install-rust-toolchain

      - run: make fmt.check

  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - uses: ./.github/actions/install-build-dependencies

      - uses: ./.github/actions/install-rust-toolchain

      - name: DIAGNOSTIC - serial run to name the crashing test
        if: runner.os == 'Windows'
        run: cargo test -p llama-cpp-bindings --lib -- --test-threads=1 --nocapture

      - run: make test.unit

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/cppcheck-src
          key: cppcheck-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - uses: ./.github/actions/install-rust-toolchain

      - run: make lint.cpp.cppcheck

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - uses: ./.github/actions/install-rust-toolchain

      - run: make target/lint-venv/bin/clang-tidy

      - run: make lint.cpp.clang-tidy CLANG_TIDY=target/lint-venv/bin/clang-tidy
