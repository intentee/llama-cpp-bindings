[package]
name = "llama-cpp-bindings"
description = "llama.cpp bindings for Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
encoding_rs = { workspace = true }
llama-cpp-bindings-sys = { workspace = true }
llama-cpp-chat = { workspace = true }
llama-cpp-context = { workspace = true }
llama-cpp-model = { workspace = true }
llama-cpp-mtmd = { workspace = true }
llama-cpp-sampler = { workspace = true }
llama-cpp-token-usage = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["openmp", "android-shared-stdcxx"]
cuda = ["llama-cpp-model/cuda"]
cuda-no-vmm = ["cuda", "llama-cpp-model/cuda-no-vmm"]
metal = ["llama-cpp-model/metal"]
dynamic-link = ["llama-cpp-model/dynamic-link"]
dynamic-backends = ["dynamic-link", "llama-cpp-model/dynamic-backends"]
vulkan = ["llama-cpp-model/vulkan"]
openmp = ["llama-cpp-model/openmp"]
rocm = ["llama-cpp-model/rocm"]
android-shared-stdcxx = ["llama-cpp-model/android-shared-stdcxx"]
android-static-stdcxx = ["llama-cpp-model/android-static-stdcxx"]
system-ggml = ["llama-cpp-model/system-ggml"]
system-ggml-static = ["system-ggml", "llama-cpp-model/system-ggml-static"]

[lints]
workspace = true
