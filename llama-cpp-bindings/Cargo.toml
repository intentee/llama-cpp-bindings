[package]
name = "llama-cpp-bindings"
description = "llama.cpp bindings for Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lib]
doctest = false

[dependencies]
encoding_rs = { workspace = true }
enumflags2 = { workspace = true }
llama-cpp-backend = { workspace = true }
llama-cpp-bindings-sys = { workspace = true }
llama-cpp-bindings-types = { workspace = true }
llama-cpp-error-recorder = { workspace = true }
llama-cpp-ffi-status = { workspace = true }
llama-cpp-gbnf = { workspace = true }
llama-cpp-params = { workspace = true }
llama-cpp-token-usage = { workspace = true }
llguidance = { workspace = true }
log = { workspace = true }
once_cell = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toktrie = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
llama-cpp-fault-injection = { workspace = true }
llama-cpp-gguf = { workspace = true }
llama-cpp-wrapper-error-fixture = { workspace = true }

[[test]]
name = "sampler_chain_without_backend"

[features]
default = ["openmp", "android-shared-stdcxx"]
cuda = ["llama-cpp-backend/cuda"]
cuda-no-vmm = ["cuda", "llama-cpp-backend/cuda-no-vmm"]
metal = ["llama-cpp-backend/metal"]
dynamic-link = ["llama-cpp-backend/dynamic-link"]
dynamic-backends = ["dynamic-link", "llama-cpp-backend/dynamic-backends"]
vulkan = ["llama-cpp-backend/vulkan"]
openmp = ["llama-cpp-backend/openmp"]
rocm = ["llama-cpp-backend/rocm"]
android-shared-stdcxx = ["llama-cpp-backend/android-shared-stdcxx"]
android-static-stdcxx = ["llama-cpp-backend/android-static-stdcxx"]
system-ggml = ["llama-cpp-backend/system-ggml"]
system-ggml-static = ["system-ggml", "llama-cpp-backend/system-ggml-static"]

[lints]
workspace = true
